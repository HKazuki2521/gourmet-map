<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>グルメマップ</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="グルメマップ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f1e7">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  html, body { margin:0; height:100%; background:#f6f1e7; overflow:hidden; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; display:block; }
  #boot { position:fixed; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:#f6f1e7; transition:opacity .5s ease; }
  #boot.hide { opacity:0; pointer-events:none; }
  #boot b { font:800 40px "Hiragino Mincho ProN","Yu Mincho",serif; color:#1b1815; letter-spacing:.06em; }
  #boot i { width:120px; height:1px; background:#d7b46a; }
  #boot em { font:italic 500 13px Georgia,serif; letter-spacing:.5em; color:#a6823d; }
  #boot small { margin-top:18px; font:12px -apple-system,sans-serif; color:#8a8174; opacity:0; transition:opacity .4s; }
  #boot small.on { opacity:1; }
</style>
</head>
<body>
<div id="boot"><b>グルメマップ</b><i></i><em>GOURMET MAP</em><small id="slow">読み込み中です…</small></div>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbx3gyuVMPhSdJd3OWO0Q5Fvo6a48JgTt7cAoLKqKzzPQdQuc8VzBvZnO-TCrT7irF2m/exec"
        allow="geolocation; clipboard-write" title="グルメマップ"></iframe>
<script>
  var boot = document.getElementById("boot");
  function hide() { boot.classList.add("hide"); setTimeout(function () { boot.style.display = "none"; }, 600); }
  document.getElementById("app").addEventListener("load", function () { setTimeout(hide, 400); });
  setTimeout(function () { document.getElementById("slow").classList.add("on"); }, 4000);
  setTimeout(hide, 15000);
</script>
</body>
</html>
